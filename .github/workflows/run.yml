name: Auto Create Today Post & Update README

on:
  workflow_dispatch: # 允许在 GitHub 后台手动触发
  schedule:
    - cron: '20 1 * * *' # 

jobs:
  create-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 执行脚本生成文章并更新 README
        run: |
          python - << 'EOF'
          import os
          import glob
          import datetime
          import re
          import random

          # ----------------- 2. 自动更新根目录下的 README.md -----------------
          readme_path = "README.md"
          if os.path.exists(readme_path):
              print(f"Found {readme_path}, updating dates...")
              with open(readme_path, 'r', encoding='utf-8') as f:
                  readme_content = f.read()

              readme_content = re.sub(r'\b20\d{2}-\d{1,2}-\d{1,2}\b', today_file_date_str, readme_content)
              readme_content = re.sub(r'20\d{2}年\d{1,2}月\d{1,2}[日号]', target_chinese_date, readme_content)
              readme_content = re.sub(r'\b\d{1,2}月\d{1,2}[日号]', target_short_chinese_date, readme_content)
              readme_content = re.sub(r'\b20\d{2}/\d{1,2}/\d{1,2}\b', target_slash_date, readme_content)
              readme_content = re.sub(r'\b20\d{2}\d{2}\d{2}\b', target_compact_date, readme_content)

              with open(readme_path, 'w', encoding='utf-8') as f:
                  f.write(readme_content)
              print("Successfully updated dates in README.md")
          else:
              print("README.md not found in root directory, skipping.")
          EOF

      - name: 提交并推送修改
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily auto-update  and README"
          branch: main
         
